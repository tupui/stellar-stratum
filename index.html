<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <meta property="og:image" content="/social-card.png" />

    <meta property="og:locale" content="en_US" />

    <meta name="twitter:image" content="/social-card.png" />
    
    <!-- Mobile Meta Tags -->
    <meta name="theme-color" content="#0D0D10" />
    
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="icon" sizes="16x16" href="/favicon-16x16.png" type="image/png">
    <link rel="icon" sizes="32x32" href="/favicon-32x32.png" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" sizes="192x192" href="/android-chrome-192x192.png" type="image/png">
    <link rel="icon" sizes="512x512" href="/android-chrome-512x512.png" type="image/png">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Stratum",
      "description": "Stellar's threshold-based authorization system for multi-signature transactions",
      "url": "https://stellar-stratum.xyz/",
      "logo": "/social-card.png",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Web",
      "creator": {
        "@type": "Organization",
        "name": "Consulting Manao GmbH",
        "url": "https://consulting-manao.com/",
        "sameAs": [
          "/"
        ]
      },
      "keywords": "stellar, multisig, multi-signature, transactions, blockchain, cryptocurrency"
    }
    </script>
    
    <!-- Loading screen: the logo switches on like a picture tube. It shows only if the app takes longer
         than 300 ms, and leaves the moment the app renders (public/loader.js). -->
    <style>
      :root { --ink: 240 10% 6%; --white: 280 16% 96%; --muted-text: 240 6% 67%; }
      body { margin: 0; background: hsl(var(--ink)); color: hsl(var(--white)); font-family: 'Chivo', system-ui, sans-serif; }
      #app-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: hsl(var(--ink)); visibility: hidden; animation: loader-show 0s 300ms forwards; }
      #app-loader img { width: 208px; height: 208px; transform-origin: center; animation: loader-crt 480ms steps(1, end) 300ms both; }
      #app-loader .loader-title { font-family: 'Jersey 15', ui-monospace, monospace; font-size: 48px; line-height: 1; margin-top: 8px; letter-spacing: .02em; }
      #app-loader .loader-subtitle { font-size: 14px; color: hsl(var(--muted-text)); }
      #app-loader.hidden { display: none; }
      @keyframes loader-show { to { visibility: visible; } }
      @keyframes loader-crt {
        0% { transform: scale(.5, .015); filter: brightness(4); }
        16% { transform: scale(1, .015); filter: brightness(3); }
        33% { transform: scale(1, .35); filter: brightness(2.2); }
        50% { transform: scale(1, 1.06); filter: brightness(1.8); }
        66% { transform: translateX(3px); filter: brightness(1.35) saturate(1.6); }
        83% { transform: translateX(-2px); filter: brightness(1.12); }
        100% { transform: none; filter: none; }
      }
      @media (prefers-reduced-motion: reduce) { #app-loader img { animation: none; } }
    </style>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https: wss: data: blob: ws://127.0.0.1:21335 ws://localhost:21335 http://127.0.0.1:21325 http://127.0.0.1:21328 http://localhost:21325 http://localhost:21328; media-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' https://connect.trezor.io; object-src 'none'; base-uri 'self'; form-action 'self';" />

    <meta name="twitter:site" content="@PamphileRoy" />
  </head>

  <body>
    <div id="app-loader" role="status">
      <img src="/brand/logo-crt.svg" alt="" />
      <div class="loader-title">STRATUM</div>
      <div class="loader-subtitle">Loading Stellar Multisig Wallet...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Hide the loader once the app renders (a file, not inline: the CSP allows no inline script) -->
    <script src="/loader.js"></script>
  </body>
</html>
