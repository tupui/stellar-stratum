name: Upgrade contract through Stratum

on:
  workflow_dispatch:
    inputs:
      stage:
        description: upload first, then upgrade once the upload has been signed and sent
        type: choice
        options: [upload, upgrade]
        default: upload

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32v1-none && cargo build --release --target wasm32v1-none
      - id: wasm
        run: echo "hash=$(sha256sum target/wasm32v1-none/release/my_contract.wasm | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - if: inputs.stage == 'upload'
        uses: tupui/stellar-stratum/action@action-v1
        with:
          source-account: ${{ vars.DEPLOYER_ACCOUNT }}
          network: testnet
          wasm: target/wasm32v1-none/release/my_contract.wasm

      - if: inputs.stage == 'upgrade'
        uses: tupui/stellar-stratum/action@action-v1
        with:
          source-account: ${{ vars.DEPLOYER_ACCOUNT }}
          network: testnet
          operation: call
          contract: ${{ vars.CONTRACT_ID }}
          method: upgrade
          args: '{"new_wasm_hash": "${{ steps.wasm.outputs.hash }}"}'
